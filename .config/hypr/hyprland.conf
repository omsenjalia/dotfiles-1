exec-once = /nix/store/g6a7agib4hbnvqcny05fk8dfjplw8nkb-dbus-1.16.2/bin/dbus-update-activation-environment --systemd --all && systemctl --user stop graphical-session.target && systemctl --user start hyprland-session.target
$mod=SUPER
source=/nix/store/hy5587kh17lxh9cikbkasbv8fm0gvw12-catppuccin-hyprland-0-unstable-2024-06-19/mocha.conf
source=/nix/store/6mabxnzbgjrvbmnfyxj5hzwj10s3mmic-hyprland-pink-accent.conf
animations {
  bezier=wind, 0.05, 0.9, 0.1, 1.05
  bezier=winIn, 0.1, 1.1, 0.1, 1.1
  bezier=winOut, 0.3, -0.3, 0, 1
  bezier=liner, 1, 1, 1, 1
  animation=windows, 1, 6, wind, slide
  animation=windowsIn, 1, 6, winIn, slide
  animation=windowsOut, 1, 5, winOut, slide
  animation=windowsMove, 1, 5, wind, slide
  animation=border, 1, 1, liner
  animation=borderangle, 1, 30, liner, loop
  animation=fade, 1, 10, default
  animation=workspaces, 1, 5, wind
  enabled=true
}

bind=$mod, D, exec, vicinae toggle
bind=$mod, B, exec, chromium
bind=$mod, E, exec, cosmic-files
bind=$mod, C, exec, nvim
bind=$mod, Return, exec, ghostty
bind=$mod, L, exec, gtklock
bind=$mod, O, exec, obsidian
bind=$mod SHIFT, V, exec, vicinae deeplink vicinae://extensions/vicinae/clipboard/history
bind=$mod, Q, killactive,
bind=$mod, F, fullscreen,
bind=$mod, Space, togglefloating,
bind=$mod, P, pseudo,
bind=$mod, S, togglesplit,
bind=$mod, g, togglegroup
bind=$mod, tab, changegroupactive
bind=$mod, grave, togglespecialworkspace
bind=$mod SHIFT, grave, movetoworkspace, special
bind=, Print, exec, grim -g "$(slurp)" - | wl-copy
bind=$mod SHIFT, s, exec, grim -g "$(slurp)" - | wl-copy
bind=$mod, mouse_down, workspace, e+1
bind=$mod, mouse_up, workspace, e-1
bind=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=, XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=, XF86AudioPlay, exec, playerctl play-pause
bind=, XF86AudioPause, exec, playerctl play-pause
bind=, XF86AudioNext, exec, playerctl next
bind=, XF86AudioPrev, exec, playerctl previous
bind=$mod, 1, workspace, 1
bind=$mod SHIFT, 1, movetoworkspace, 1
bind=$mod, 2, workspace, 2
bind=$mod SHIFT, 2, movetoworkspace, 2
bind=$mod, 3, workspace, 3
bind=$mod SHIFT, 3, movetoworkspace, 3
bind=$mod, 4, workspace, 4
bind=$mod SHIFT, 4, movetoworkspace, 4
bind=$mod, 5, workspace, 5
bind=$mod SHIFT, 5, movetoworkspace, 5
bind=$mod, 6, workspace, 6
bind=$mod SHIFT, 6, movetoworkspace, 6
bind=$mod, 7, workspace, 7
bind=$mod SHIFT, 7, movetoworkspace, 7
bind=$mod, 8, workspace, 8
bind=$mod SHIFT, 8, movetoworkspace, 8
bind=$mod, 9, workspace, 9
bind=$mod SHIFT, 9, movetoworkspace, 9
bind=$mod, 0, workspace, 10
bind=$mod SHIFT, 0, movetoworkspace, 10

binde=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde=, XF86MonBrightnessUp, exec, brightnessctl set 5%+ -q
binde=, XF86MonBrightnessDown, exec, brightnessctl set 5%- -q

bindm=$mod, mouse:272, movewindow
bindm=$mod, mouse:273, resizewindow

cursor {
  no_hardware_cursors=true
}

decoration {
  blur {
    brightness=1
    contrast=1.300000
    enabled=true
    ignore_opacity=true
    new_optimizations=true
    noise=0.011700
    passes=2
    size=2
    xray=true
  }

  shadow {
    color=rgb(11111B)
    color_inactive=rgba(11111B00)
    enabled=true
  }
  active_opacity=1.000000
  fullscreen_opacity=1.000000
  inactive_opacity=1.000000
  rounding=15
}

dwindle {
  preserve_split=true
  pseudotile=true
}

general {
  border_size=2
  col.active_border=$pink
  col.inactive_border=$surface1
  gaps_in=8
  gaps_out=8
  gaps_workspaces=0
}

gesture=3,horizontal,workspace
gesture=4,horizontal,workspace

group {
  groupbar {
    font_size=12
    gradients=false
    render_titles=false
    scrolling=true
  }
  col.border_active=$rosewater
  col.border_inactive=$surface1
  focus_removed_window=true
  insert_after_current=true
}

input {
  touchpad {
    disable_while_typing=false
    natural_scroll=false
    tap-to-click=true
  }
  follow_mouse=1
  kb_layout=us
  numlock_by_default=true
  sensitivity=-0.800000
}

layerrule=blur on, ignore_alpha 0, match:namespace vicinae
layerrule=no_anim on, match:namespace vicinae

misc {
  disable_autoreload=true
  disable_hyprland_logo=true
  disable_splash_rendering=true
  enable_anr_dialog=false
  enable_swallow=false
  force_default_wallpaper=0
  key_press_enables_dpms=true
  mouse_move_enables_dpms=true
  swallow_regex=wezterm|foot|cosmic-files|nemo|com.mitchellh.ghostty
}

windowrule=float on, match:title ^(nm-connection-editor)$
windowrule=float on, match:title ^(Network)$
windowrule=float on, match:title ^(xdg-desktop-portal-gtk)$
windowrule=float on, match:class gay.vaskel.soteria
windowrule=float on, match:title ^(Picture-in-Picture)$
windowrule=float on, match:class ^(download)$
windowrule=center on, float on, size (monitor_w*0.4) (monitor_h*0.6), match:initial_title (Open Files)
windowrule=center on, float on, size (monitor_w*0.4) (monitor_h*0.6), match:class .blueman-manager-wrapped
windowrule=center on, float on, size (monitor_w*0.4) (monitor_h*0.6), match:class com.saivert.pwvucontrol
windowrule=float on, size 800 600, match:title Bitwarden
windowrule=workspace 6, match:class discord
windowrule=workspace 7, match:class spotify
windowrule=workspace special silent, match:title ^(Firefox — Sharing Indicator)$
windowrule=workspace special silent, match:title ^(.*is sharing (your screen|a window).)$
monitor=DP-1,1920x1080@144,0x0,1.000000
monitor=DP-2,1920x1080@60,1920x0,1.000000

workspace=1, monitor:DP-1, default:true
workspace=2, monitor:DP-1
workspace=3, monitor:DP-1
workspace=4, monitor:DP-1
workspace=5, monitor:DP-1
workspace=6, monitor:DP-2
workspace=7, monitor:DP-2
workspace=8, monitor:DP-2
workspace=9, monitor:DP-2
workspace=10, monitor:DP-2


# █▀▄▀█ █▀█ █░█ █▀▀
# █░▀░█ █▄█ ▀▄▀ ██▄
bind=SUPER, M, submap, move
submap=move

  binde = , left, movewindow, l
  binde = , right, movewindow, r
  binde = , up, movewindow, u
  binde = , down, movewindow, d
  binde = , j, movewindow, l
  binde = , l, movewindow, r
  binde = , i, movewindow, u
  binde = , k, movewindow, d

  bind=,escape,submap,reset
submap=reset

# █▀█ █▀▀ █▀ █ ▀█ █▀▀
# █▀▄ ██▄ ▄█ █ █▄ ██▄
bind=SUPER, R, submap, resize
submap=resize

  binde = , left, resizeactive, -20 0
  binde = , right, resizeactive, 20 0
  binde = , up, resizeactive, 0 -20
  binde = , down, resizeactive, 0 20
  binde = , h, resizeactive, -20 0
  binde = , j, resizeactive, 20 0
  binde = , i, resizeactive, 0 -20
  binde = , k, resizeactive, 0 20

  bind=,escape,submap,reset
submap=reset
