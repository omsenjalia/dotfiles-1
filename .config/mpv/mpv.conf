
alang=%9%en,jpn,jp
border=%2%no
cursor-autohide=%3%100
gpu-api=%6%vulkan
hwdec=%9%auto-copy
msg-color=%3%yes
msg-module=%3%yes
osc=%2%no
profile=%6%gpu-hq
reset-on-next-file=%74%video-zoom,panscan,video-unscaled,video-rotate,video-align-x,video-align-y
save-watch-history=%3%yes
screenshot-directory=%28%~/media/pictures/screenshots
screenshot-format=%3%png
screenshot-high-bit-depth=%3%yes
screenshot-png-compression=%1%4
screenshot-tag-colorspace=%3%yes
screenshot-template=%60%%x/screenshot-%F-T%wH.%wM.%wS.%wT-F%{estimated-frame-number}
stop-screensaver=%3%yes
vo=%8%gpu-next
volume-max=%3%200
ytdl-raw-options=%38%cookies=~/documents/yt-dlp-cookies.txt

[image]
image-display-duration=%3%inf
include=%65%/nix/store/1a7026q60rsmhha4ka91kl9l41pkk925-mpv-image-viewer.conf
loop-file=%3%inf
loop-playlist=%3%inf
